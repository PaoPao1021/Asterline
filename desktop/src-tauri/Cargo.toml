[package]
name = "asterline-desktop"
version = "0.2.0"
edition = "2024"
description = "Asterline Desktop host"
license = "MIT"
repository = "https://github.com/song0705/Asterline"
build = "build.rs"

[lib]
name = "asterline_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "asterline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
asterline = { path = "../.." }
atomicwrites = "0.4"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.5", features = [] }
time = { version = "0.3.41", features = ["formatting"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
