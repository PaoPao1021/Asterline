name: Desktop Release

on:
  push:
    tags:
      - "desktop-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Verify Desktop release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match tag and package versions
        shell: bash
        run: |
          tag_version=${GITHUB_REF_NAME#desktop-v}
          node_version=$(node -p "require('./desktop/package.json').version")
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)
          config_version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          test "$tag_version" = "$node_version"
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$config_version"
      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-release-quality
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop lint
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop build
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

  build:
    name: Package Desktop · ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - label: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - label: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - label: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-release-${{ matrix.target }}
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Prepare required macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for value in "$CERTIFICATE_PASSWORD" "$APPLICATION_IDENTITY" "$NOTARY_KEY_P8_BASE64" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            test -n "$value" || { echo "Incomplete macOS signing/notarization secrets." >&2; exit 1; }
          done
          test -n "$CERTIFICATE_P12_BASE64" || { echo "Missing macOS signing certificate." >&2; exit 1; }
          certificate="$RUNNER_TEMP/asterline-desktop.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          keychain="$RUNNER_TEMP/asterline-desktop-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          notary_key="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          echo "APPLE_SIGNING_IDENTITY=$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "ASTERLINE_DESKTOP_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: pnpm --dir desktop tauri build --no-bundle --target ${{ matrix.target }}
      - name: Build signed and notarized macOS bundles
        if: runner.os == 'macOS'
        run: pnpm --dir desktop tauri build --bundles app,dmg --target ${{ matrix.target }}
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: pnpm --dir desktop tauri build --bundles appimage --target ${{ matrix.target }}
      - name: Package Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          $targetDir = "desktop/src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$targetDir/asterline-desktop.exe", LICENSE, docs/desktop.md, docs/desktop.zh-CN.md -DestinationPath "dist/asterline-desktop-$version-${{ matrix.label }}-portable.zip"
          ./scripts/build-windows-desktop-installer.ps1 -Version $version -TargetDirectory $targetDir
      - name: Package macOS DMG and portable app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#desktop-v}
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg=$(find "$bundle_root" -type f -name '*.dmg' -print -quit)
          app=$(find "$bundle_root" -type d -name '*.app' -print -quit)
          test -n "$dmg" && test -n "$app"
          mkdir -p dist
          cp "$dmg" "dist/asterline-desktop-$version-${{ matrix.label }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/asterline-desktop-$version-${{ matrix.label }}-portable.zip"
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#desktop-v}
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          appimage=$(find "$bundle_root" -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          mkdir -p dist
          cp "$appimage" "dist/asterline-desktop-$version-${{ matrix.label }}.AppImage"
          chmod +x "dist/asterline-desktop-$version-${{ matrix.label }}.AppImage"
      - name: Smoke test Windows executable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          $installer = (Resolve-Path "dist/asterline-desktop-$version-x86_64-windows-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "AsterlineDesktopInstallerSmoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir "asterline-desktop.exe"))) { throw "Desktop installer smoke test failed." }
          $application = Start-Process -FilePath (Join-Path $installDir "asterline-desktop.exe") -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 8
          $application.Refresh()
          if ($application.HasExited) { throw "Desktop application exited during launch smoke test with code $($application.ExitCode)." }
          if ($application.MainWindowHandle -eq 0) { throw "Desktop application did not create its main window." }
          Stop-Process -Id $application.Id -Force
          Wait-Process -Id $application.Id -ErrorAction SilentlyContinue
          $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Desktop uninstaller smoke test failed." }
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if test -n "${ASTERLINE_DESKTOP_KEYCHAIN:-}"; then
            security delete-keychain "$ASTERLINE_DESKTOP_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Desktop GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS-desktop
      - name: Attest Desktop release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create Desktop GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes_file"; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${notes[@]}" \
            --title "Asterline Desktop ${GITHUB_REF_NAME#desktop-v}"
